name: searchlight
description: Pure Dart full-text search for structured records with filtering, facets, tokenizer configuration, and persisted indexes.
version: 0.2.1
homepage: https://github.com/kingdomseed/searchlight
repository: https://github.com/kingdomseed/searchlight
issue_tracker: https://github.com/kingdomseed/searchlight/issues
documentation: https://deepwiki.com/kingdomseed/searchlight
topics:
  - search
  - full-text-search
  - indexing
  - tokenization

environment:
  sdk: ^3.3.0

dependencies:
  cbor: ^6.5.1
  geobase: ^1.5.0
  meta: ^1.12.0
  r_tree: ^3.0.2
  snowball_stemmer: ^0.1.0
  unorm_dart: ^0.3.2

dev_dependencies:
  searchlight_highlight:
    git:
      url: https://github.com/kingdomseed/searchlight_highlight.git
      ref: main
  test: ^1.25.0
  very_good_analysis: ^10.0.0
